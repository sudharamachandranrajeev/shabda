name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Check tag matches project version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content src/Shabda/Shabda.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME does not match csproj version $version" }

      - name: Test
        run: dotnet test --configuration Release

      - name: Publish
        shell: pwsh
        run: |
          $v = $env:GITHUB_REF_NAME.TrimStart('v')
          dotnet publish src/Shabda/Shabda.csproj -c Release -o publish
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item publish/Shabda.exe "dist/Shabda-$v-win-x64.exe"
          Compress-Archive -Path scripts, data, docs, LICENSE, README.md -DestinationPath "dist/Shabda-$v-scripts.zip"
          # LF line endings so `sha256sum -c` works on Linux and macOS too.
          $sums = Get-ChildItem dist | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)`n" }
          [IO.File]::WriteAllText("$PWD/dist/SHA256SUMS.txt", -join $sums)

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $pre = if ($env:GITHUB_REF_NAME -like 'v0.*') { '--prerelease' } else { '' }
          gh release create $env:GITHUB_REF_NAME dist/* --title "Shabda $env:GITHUB_REF_NAME" --generate-notes $pre
